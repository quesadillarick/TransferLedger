<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer Ledger</title>
<style id="app-style">
:root{
  --bg:#f3f1ec;--panel:#fffdf9;--ink:#1c2326;--muted:#647077;--line:#dcd7cd;--line2:#ebe7df;
  --accent:#0b5d6b;--accent-ink:#ffffff;--soft:#e4eff0;--warn:#8a5200;--warn-bg:#fcefd2;
  --bad:#a3271f;--bad-bg:#fbe6e3;--ok:#1f6a3a;--shadow:0 1px 2px rgba(0,0,0,.06);
  --mono:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13181a;--panel:#1b2123;--ink:#e5e9ea;--muted:#95a1a6;--line:#2f393c;--line2:#252d30;
  --accent:#5cc0cf;--accent-ink:#06282e;--soft:#1d3236;--warn:#f0c36a;--warn-bg:#3a2e12;
  --bad:#ff8a80;--bad-bg:#3d1c19;--ok:#7fd49a;--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#13181a;--panel:#1b2123;--ink:#e5e9ea;--muted:#95a1a6;--line:#2f393c;--line2:#252d30;
  --accent:#5cc0cf;--accent-ink:#06282e;--soft:#1d3236;--warn:#f0c36a;--warn-bg:#3a2e12;
  --bad:#ff8a80;--bad-bg:#3d1c19;--ok:#7fd49a;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;line-height:1.2}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 7px}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button.danger:hover{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=date],input[type=search],input[type=number],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f>*{font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink)}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

#app{display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 12px var(--mono);letter-spacing:.02em}
.brand h1{font-size:15px;font-weight:650;line-height:1.15}
.brand p{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px}
.tabs button{border-color:transparent;background:transparent;color:var(--muted);font-weight:600;padding:7px 12px}
.tabs button[aria-current="true"]{color:var(--ink);background:var(--soft)}
.save{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);max-width:44ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.pill.ok::before{background:var(--ok)}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}.pill.warn::before{background:var(--warn)}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}.pill.bad::before{background:var(--bad)}
.banner{padding:9px 18px;background:var(--warn-bg);color:var(--warn);display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.banner button{background:transparent;border-color:currentColor;color:inherit;font-weight:600}

.ledger{display:grid;grid-template-columns:232px minmax(0,1fr);flex:1;min-height:0}
.side{border-right:1px solid var(--line);padding:14px 10px 30px;background:var(--panel)}
.side h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px;font-weight:600}
.dayrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:6px 8px}
.dayrow:hover{background:var(--line2)}
.dayrow[aria-current="true"]{background:var(--soft);font-weight:600}
.dayrow small{color:var(--muted);font-weight:400;white-space:nowrap}
.dayrow .tag{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-left:6px}
.main{padding:20px 24px 80px;min-width:0;max-width:1280px}
.dayhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.dayhead h2{font-size:24px;font-weight:650;letter-spacing:-.01em}
.dayhead .sub{color:var(--muted)}
.dayhead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.details{padding:12px 14px;margin-bottom:12px}
.details>summary{cursor:pointer;font-weight:600;list-style-position:inside}
.details>summary span{font-weight:400;color:var(--muted);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 12px;margin-top:10px}
.grid .wide{grid-column:1/-1}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;margin-bottom:18px;transition:border-color .12s,background .12s}
.drop strong{display:block;font-size:16px;margin-bottom:2px}
.drop .btns{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.drop.past{border-color:var(--warn)}
.drop.locked{opacity:.65}
body.dragging .drop:not(.locked){border-color:var(--accent);background:var(--soft)}
.batch{margin-bottom:14px;overflow:hidden}
.batch.hover{outline:2px solid var(--accent);outline-offset:1px}
.bhead{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line2)}
button.tog{padding:2px 6px;font-size:13px;margin:0 -6px 0 -6px;color:var(--ink)}
.bno{font:700 12px var(--mono);background:var(--soft);color:var(--accent);padding:3px 8px;border-radius:4px}
.bhead .acts{margin-left:auto;display:flex;gap:2px}
.bmeta{padding:8px 14px;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;border-bottom:1px solid var(--line2)}
.bmeta b{font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-right:5px}
.bmeta .note{flex-basis:100%}
.bedit{padding:4px 14px 14px;border-bottom:1px solid var(--line2)}
.bedit .row{margin-top:10px;display:flex;gap:8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--line2);vertical-align:baseline}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
td.path{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere;min-width:220px}
td.path .dir{color:var(--muted)}
td.hash{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted);cursor:copy}
td.hash.err{color:var(--bad);cursor:default}
td.nw{white-space:nowrap}
.in{color:var(--muted)}
.notex{font-family:var(--sans);font-size:11.5px;color:var(--warn);white-space:nowrap}
.more{padding:8px 14px;text-align:center;border-top:1px solid var(--line2)}
.empty{padding:36px 14px;text-align:center;color:var(--muted)}

.page{padding:20px 24px 80px;max-width:1280px;width:100%}
.page h2{font-size:20px;margin-bottom:12px}
.page h3{font-size:14px;margin:0 0 8px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px 14px;margin-bottom:14px}
.bar label.f{width:150px}.bar label.f.grow{flex:1;min-width:180px}
.presets{display:flex;gap:4px;flex-wrap:wrap;flex-basis:100%}
.presets button{padding:4px 10px;font-size:12.5px}
.presets button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.tile{padding:12px 14px}
.tile b{display:block;font-size:24px;font-weight:650;letter-spacing:-.01em}
.tile span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.cols .card{padding:12px 14px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-bottom:7px;font-size:13px}
.brow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .meter{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line2)}
.brow .meter i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.sect{margin-bottom:14px}
.sect>h3{padding:12px 14px 0}
.exports{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.settings .card{padding:14px;margin-bottom:14px}
.check{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.check input{margin-top:3px}

#busy{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:50}
#busy.on{display:grid}
#busy .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;width:min(460px,calc(100vw - 32px))}
#busy .name{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0 10px}
#busy .meter{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin-bottom:12px}
#busy .meter i{display:block;height:100%;width:0;background:var(--accent)}
#hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:600;pointer-events:none;display:none;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25)}
body.dragging #hint{display:block}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 36px))}
#toast div{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#print-area{display:none}

@media (max-width:820px){
  .ledger{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);max-height:210px;overflow:auto}
  .main,.page{padding:16px 16px 80px}
  .save{margin-left:0}
}
@media print{
  #app,#busy,#hint,#toast{display:none!important}
  body{background:#fff;color:#000;font:10pt/1.35 "Segoe UI",Arial,sans-serif}
  #print-area{display:block}
  #print-area h1{font-size:16pt;margin-bottom:2pt}
  #print-area h2{font-size:12pt;margin:14pt 0 4pt;border-bottom:1.5pt solid #000;padding-bottom:2pt;break-after:avoid}
  #print-area h3{font-size:10pt;margin:8pt 0 2pt;break-after:avoid}
  #print-area .pm{font-size:9pt;margin-bottom:3pt}
  #print-area .pm b{font-weight:600}
  #print-area table{font-size:8pt;margin-bottom:6pt}
  #print-area th,#print-area td{border:0;border-bottom:.5pt solid #999;padding:2pt 4pt;color:#000}
  #print-area th{font-size:7pt}
  #print-area td.h{font-family:Consolas,monospace;font-size:6.5pt;word-break:break-all;width:34%}
  #print-area td.p{font-family:Consolas,monospace;font-size:7.5pt;word-break:break-all}
  #print-area .sum td,#print-area .sum th{font-size:9pt}
  #print-area .sign{margin-top:28pt;display:flex;gap:28pt;break-inside:avoid}
  #print-area .sign div{flex:1;border-top:.75pt solid #000;padding-top:3pt;font-size:8pt}
  @page{margin:14mm}
}
</style>
</head>
<body>
<script id="ledger-data" type="application/json">{}</script>
<script id="app-code">
(function(){
'use strict';
// The app rebuilds its own file from these two strings plus the current data, so saving never depends on the live DOM.
var CODE=document.currentScript.textContent;
var CSS=document.getElementById('app-style').textContent;
var SC='</'+'script>';
var DATA_OPEN='<script id="ledger-data" type="application/json">';
var HAS_FSA=typeof window.showSaveFilePicker==='function';
var FIELDS=[['dir','Direction'],['media','Media / method'],['src','Source system'],['dst','Destination system'],['ref','Reference / ticket'],['by','Performed by']];
var DIRS=['Into air-gapped network','Out of air-gapped network','Between air-gapped systems'];
var MEDIA=['CD-R','DVD-R','BD-R','USB drive','External hard drive','Cross-domain solution'];
var RPT_CAP=500, LOG_CAP=5000;

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function uid(){var a=new Uint8Array(8);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return pad2h(b);}).join('');}
function pad2h(b){return (b<16?'0':'')+b.toString(16);}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function keyDate(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtDay(k,long){return keyDate(k).toLocaleDateString(undefined,long?{weekday:'long',year:'numeric',month:'long',day:'numeric'}:{weekday:'short',month:'short',day:'numeric'});}
function fmtTime(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtStamp(t){if(!t)return '';var d=new Date(t);return dayKey(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function fmtSize(n){if(n<1024)return n+' B';var u=['KB','MB','GB','TB','PB'],i=-1;do{n/=1024;i++;}while(n>=1024&&i<u.length-1);return (n>=100?n.toFixed(0):n.toFixed(1))+' '+u[i];}
function fmtN(n){return Number(n).toLocaleString();}
function plural(n,w){return fmtN(n)+' '+w+(n===1?'':'s');}
function baseName(p){var i=p.lastIndexOf('/');return i<0?p:p.slice(i+1);}
function extOf(p){var n=baseName(p),i=n.lastIndexOf('.');return i>0?n.slice(i).toLowerCase():'(none)';}
function toast(msg,ms){var t=$('#toast'),d=document.createElement('div');d.textContent=msg;t.appendChild(d);setTimeout(function(){d.remove();},ms||4200);}

/* ---------- state ---------- */
function blank(){return {app:'transfer-ledger',v:1,id:uid(),rev:0,created:Date.now(),savedAt:0,
  settings:{org:'',theme:'auto',hash:true,skipDup:true,zip:true,zipHash:true,rows:10,defaults:{dir:DIRS[0],media:'',src:'',dst:'',ref:'',by:'',note:''}},days:{},log:[]};}
function normalize(d){
  var b=blank();
  if(!d||d.app!=='transfer-ledger'||typeof d.days!=='object')return b;
  d.settings=Object.assign(b.settings,d.settings||{});
  d.settings.defaults=Object.assign(blank().settings.defaults,d.settings.defaults||{});
  d.settings.rows=Math.min(5000,Math.max(1,parseInt(d.settings.rows,10)||10));
  d.log=Array.isArray(d.log)?d.log:[];d.rev=d.rev||0;d.id=d.id||b.id;
  Object.keys(d.days).forEach(function(k){var x=d.days[k];x.batches=Array.isArray(x.batches)?x.batches:[];x.batches.forEach(function(bt){bt.files=Array.isArray(bt.files)?bt.files:[];});});
  return d;
}
function parseData(txt){try{return JSON.parse(txt);}catch(e){return null;}}
var state=normalize(parseData(document.getElementById('ledger-data').textContent));
function isEmpty(s){return !Object.keys(s.days).some(function(k){return s.days[k].batches.length;});}
function dayStats(day){var f=0,s=0,z=0;(day?day.batches:[]).forEach(function(b){b.files.forEach(function(x){if(x.z)z++;else{f++;s+=x.s;}});});return {files:f,size:s,inner:z};}
function topCount(list){var n=0;for(var i=0;i<list.length;i++)if(!list[i].z)n++;return n;}
function countLabel(list){var t=topCount(list),z=list.length-t;return plural(t,'file')+(z?' and '+plural(z,'archive member'):'');}
function batchSize(b){return b.files.reduce(function(n,x){return n+(x.z?0:x.s);},0);}
function ensureDay(k){return state.days[k]||(state.days[k]={locked:false,batches:[]});}
function findBatch(k,id){var d=state.days[k];if(!d)return null;for(var i=0;i<d.batches.length;i++)if(d.batches[i].id===id)return d.batches[i];return null;}
function logEvent(action,detail){state.log.push({t:Date.now(),a:action,d:detail});if(state.log.length>LOG_CAP)state.log.splice(0,state.log.length-LOG_CAP);}

/* ---------- ui state ---------- */
var ui={view:'ledger',day:dayKey(),follow:true,today:dayKey(),expanded:{},collapsed:{},editing:null,
  rpt:{preset:'month',from:'',to:'',q:'',dir:'',media:''}};
var file={handle:null,name:'',pending:null,dirty:false,saving:false,again:false,error:'',stamp:0,conflict:false};
var busy=null;

function commit(action,detail,quiet){
  if(action)logEvent(action,detail);
  state.rev++;file.dirty=true;
  if(!quiet)render();else renderTop();
  scheduleSave();
}

/* ---------- SHA-256 (streaming, for files too large to hash in one buffer) ---------- */
var K256=(function(){var k=[],n=2;while(k.length<64){var p=true;for(var i=2;i*i<=n;i++)if(n%i===0){p=false;break;}if(p){var c=Math.cbrt(n);k.push(Math.floor((c-Math.floor(c))*4294967296)>>>0);}n++;}return new Uint32Array(k);})();
var H256=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
function Sha256(){this.h=new Uint32Array(H256);this.buf=new Uint8Array(64);this.n=0;this.len=0;this.w=new Int32Array(64);}
Sha256.prototype.block=function(d,o){
  var w=this.w,h=this.h,i,a=h[0]|0,b=h[1]|0,c=h[2]|0,e=h[4]|0,f=h[5]|0,g=h[6]|0,dd=h[3]|0,hh=h[7]|0,t1,t2,x,y;
  for(i=0;i<16;i++,o+=4)w[i]=(d[o]<<24)|(d[o+1]<<16)|(d[o+2]<<8)|d[o+3];
  for(i=16;i<64;i++){x=w[i-15];y=w[i-2];
    w[i]=(w[i-16]+w[i-7]+(((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3))+(((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10)))|0;}
  for(i=0;i<64;i++){
    t1=(hh+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K256[i]+w[i])|0;
    t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))|0;
    hh=g;g=f;f=e;e=(dd+t1)|0;dd=c;c=b;b=a;a=(t1+t2)|0;}
  h[0]+=a;h[1]+=b;h[2]+=c;h[3]+=dd;h[4]+=e;h[5]+=f;h[6]+=g;h[7]+=hh;
};
Sha256.prototype.update=function(d){
  var i=0,L=d.length;this.len+=L;
  if(this.n){while(i<L&&this.n<64)this.buf[this.n++]=d[i++];if(this.n<64)return;this.block(this.buf,0);this.n=0;}
  for(;i+64<=L;i+=64)this.block(d,i);
  while(i<L)this.buf[this.n++]=d[i++];
};
Sha256.prototype.digest=function(){
  var len=this.len,b=this.buf,n=this.n;b[n++]=0x80;
  if(n>56){while(n<64)b[n++]=0;this.block(b,0);n=0;}

}

  var i=text.indexOf(DATA_OPEN);if(i<0)return null;

  try{
    if(!force&&file.stamp){var cur=await file.handle.getFile();if(cur.lastModified!==file.stamp){file.conflict=true;throw new Error('The file was changed by something else since this page last saved it.');}}

// Called once the remembered file is readable: decide whether the file or the page holds the current data.

  var f,disk;

function importJson(text){
  var d=parseData(text);if(!d||d.app!=='transfer-ledger'||!d.days){toast('That file is not a Transfer Ledger export.');return;}
  d=normalize(d);var added=0;
  Object.keys(d.days).forEach(function(k){var have={},day=state.days[k];if(day)day.batches.forEach(function(b){have[b.id]=1;});
    d.days[k].batches.forEach(function(b){if(have[b.id])return;ensureDay(k).batches.push(b);added++;});
    if(state.days[k])state.days[k].batches.sort(function(a,b){return a.t-b.t;});});
  if(!added){toast('Nothing new to import. Every batch in that file is already here.');return;}
  commit('Import',plural(added,'batch').replace('batchs','batches')+' merged from a JSON export');toast('Imported '+added+' batch'+(added===1?'':'es')+'.');
}

    case 'save':saveClick();break;
    case 'saveas':saveAs();break;
    case 'download':downloadCopy();break;
    case 'reconnect':reconnect();break;
    case 'day':ui.view='ledger';ui.day=el.dataset.k;ui.follow=ui.day===dayKey();ui.editing=null;render();window.scrollTo(0,0);break;
    case 'today':ui.day=dayKey();ui.follow=true;render();break;
    case 'pickfiles':pick(false);break;
    case 'pickfolder':pick(true);break;
    case 'addto':pick(false,bid);break;
    case 'addfolderto':pick(true,bid);break;
    case 'edit':ui.editing=bid;ui.collapsed[bid]=false;render();break;
    case 'collapse':ui.collapsed[bid]=!ui.collapsed[bid];if(ui.collapsed[bid]&&ui.editing===bid)ui.editing=null;render();break;
    case 'collapseall':ui.editing=null;if(day)day.batches.forEach(function(q){ui.collapsed[q.id]=true;});render();break;
    case 'expandall':if(day)day.batches.forEach(function(q){ui.collapsed[q.id]=false;});render();break;
    case 'editcancel':ui.editing=null;render();break;
    case 'editsave':
      if(!b)break;var card=el.closest('.batch'),changed=[];
      Array.prototype.forEach.call(card.querySelectorAll('[data-bf]'),function(i){var k=i.getAttribute('data-bf'),v=i.value.trim();if((b[k]||'')!==v){changed.push(k);b[k]=v;}});
      ui.editing=null;if(changed.length)commit('Batch edited',ui.day+' batch '+(day.batches.indexOf(b)+1)+': '+changed.join(', '));else render();break;
    case 'rmbatch':
      if(!b||!confirm('Remove batch '+(day.batches.indexOf(b)+1)+' and its '+countLabel(b.files)+' from this list?\n\nThe removal is noted in the change history.'))break;
      var n=day.batches.indexOf(b)+1;day.batches.splice(n-1,1);if(!day.batches.length&&!day.locked)delete state.days[ui.day];
      commit('Batch removed',ui.day+' batch '+n+': '+countLabel(b.files));break;
    case 'rmfile':
      if(!b)break;var ix=+el.dataset.i,x=b.files[ix],cnt=1;if(!x||x.z)break;while(b.files[ix+cnt]&&b.files[ix+cnt].z)cnt++;
      if(!confirm('Remove "'+x.p+'"'+(cnt>1?' and its '+plural(cnt-1,'archive member'):'')+' from this list?'))break;
      b.files.splice(ix,cnt);var bn=day.batches.indexOf(b)+1;
      if(!b.files.length){day.batches.splice(bn-1,1);if(!day.batches.length&&!day.locked)delete state.days[ui.day];}
      commit('File removed',ui.day+' batch '+bn+': '+x.p);break;
    case 'expand':ui.expanded[bid]=!ui.expanded[bid];render();break;
    case 'lock':
      day=ensureDay(ui.day);
      if(day.locked&&!confirm('Unlock this list so it can be changed?'))break;
      day.locked=!day.locked;ui.editing=null;if(!day.locked&&!day.batches.length)delete state.days[ui.day];
      commit(day.locked?'List locked':'List unlocked',ui.day);break;
    case 'copy':
      if(navigator.clipboard)navigator.clipboard.writeText(el.dataset.v).then(function(){toast('Hash copied.',1500);},function(){});break;
    case 'daycsv':download('transfers-'+ui.day+'.csv',filesCsv(dayRows()),'text/csv');break;
    case 'daymanifest':download('transfers-'+ui.day+'.sha256',manifest(dayRows()));break;
    case 'dayprint':printRows(dayRows(),'File Transfer Log',ui.day);break;
    case 'preset':ui.rpt.preset=el.dataset.p;if(ui.rpt.preset==='custom'){var rg=[$('#rfrom').value,$('#rto').value];ui.rpt.from=rg[0];ui.rpt.to=rg[1];}renderReports();break;
    case 'rptcsv':download('transfer-files-'+rptLabel().replace(/ /g,'_')+'.csv',filesCsv(rptRows()),'text/csv');break;
    case 'rptdays':download('transfer-daily-totals-'+rptLabel().replace(/ /g,'_')+'.csv',daysCsv(rptRows()),'text/csv');break;
    case 'rptmanifest':download('transfers-'+rptLabel().replace(/ /g,'_')+'.sha256',manifest(rptRows()));break;
    case 'rptjson':
      rows=rptRows();var out={app:'transfer-ledger',v:1,exported:Date.now(),range:rptLabel(),days:{}};
      rows.forEach(function(r){var d=out.days[r.day]||(out.days[r.day]={locked:!!state.days[r.day].locked,batches:[]});var ob=d.batches.filter(function(q){return q.id===r.b.id;})[0];if(!ob){ob=Object.assign({},r.b,{files:[]});d.batches.push(ob);}ob.files.push(r.f);});
      download('transfers-'+rptLabel().replace(/ /g,'_')+'.json',JSON.stringify(out,null,1),'application/json');break;
    case 'rptprint':printRows(rptRows(),'File Transfer Report',rptLabel());break;
    case 'backup':download('transfer-ledger-backup-'+dayKey()+'.json',JSON.stringify(state,null,1),'application/json');break;
    case 'import':$('#pick-json').value='';$('#pick-json').click();break;
    case 'blank':var keep=state;state=blank();state.settings=JSON.parse(JSON.stringify(keep.settings));var txt=buildFile();state=keep;download('transfer-ledger-empty.html',txt,'text/html');break;
    case 'forget':
      if(!confirm('Stop saving to "'+file.name+'"? The file itself is not deleted.'))break;
      idbSet('id:'+state.id,null);idbSet('last',null);file.handle=null;file.pending=null;file.name='';file.error='';file.stamp=0;file.conflict=false;render();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target,s=state.settings;
  if(t.hasAttribute('data-df')){s.defaults[t.getAttribute('data-df')]=t.value.trim();commit(null,null,true);
    var sum=FIELDS.map(function(f){return s.defaults[f[0]];}).filter(Boolean).join(' · ');var sp=$('#defaults summary span');if(sp)sp.textContent=sum||'none set';return;}
  switch(t.id){
    case 'jump':if(t.value){ui.day=t.value;ui.follow=ui.day===dayKey();ui.editing=null;render();}break;
    case 'pick-files':case 'pick-folder':
      var list=Array.prototype.map.call(t.files,function(f){return {file:f,path:f.webkitRelativePath||f.name};});
      if(list.length)ingest({list:list,errs:[]},ui.view==='ledger'?ui.day:dayKey(),pickTarget);break;
    case 'pick-json':if(t.files[0])t.files[0].text().then(importJson);break;
    case 'rfrom':case 'rto':ui.rpt.preset='custom';ui.rpt.from=$('#rfrom').value;ui.rpt.to=$('#rto').value;renderReports();break;
    case 'rdir':ui.rpt.dir=t.value;renderReportOut();break;
    case 'rmedia':ui.rpt.media=t.value;renderReportOut();break;
    case 's-org':s.org=t.value.trim();commit(null,null,true);break;
    case 's-hash':s.hash=t.checked;commit(null,null,true);break;
    case 's-rows':s.rows=Math.min(5000,Math.max(1,parseInt(t.value,10)||10));t.value=s.rows;commit(null,null,true);break;
    case 's-zip':s.zip=t.checked;commit(null,null,true);break;
    case 's-ziphash':s.zipHash=t.checked;commit(null,null,true);break;
    case 's-dup':s.skipDup=t.checked;commit(null,null,true);break;
    case 's-theme':s.theme=t.value;applyTheme();commit(null,null,true);break;
  }
});
document.addEventListener('input',function(e){if(e.target.id==='rq'){ui.rpt.q=e.target.value;renderReportOut();}});

/* ---------- drag and drop ---------- */
var depth=0,hoverBatch=null;
function hasFiles(e){var t=e.dataTransfer&&e.dataTransfer.types;return !!t&&Array.prototype.indexOf.call(t,'Files')>=0;}
function dropDay(){return ui.view==='ledger'?ui.day:dayKey();}
function setHover(e){
  var el=ui.view==='ledger'&&e.target&&e.target.closest?e.target.closest('.batch'):null;
  if(el!==hoverBatch){if(hoverBatch)hoverBatch.classList.remove('hover');hoverBatch=el;if(el)el.classList.add('hover');}
  var dk=dropDay(),lk=state.days[dk]&&state.days[dk].locked,n=el?$('.bno',el).textContent.toLowerCase():'';
  $('#hint').textContent=lk?'This list is locked':(el?'Drop to add to '+n:'Drop to start a new batch')+' · '+fmtDay(dk);
}
function endDrag(){depth=0;document.body.classList.remove('dragging');if(hoverBatch)hoverBatch.classList.remove('hover');hoverBatch=null;}
window.addEventListener('dragenter',function(e){if(!hasFiles(e))return;e.preventDefault();depth++;document.body.classList.add('dragging');setHover(e);});
window.addEventListener('dragover',function(e){if(!hasFiles(e))return;e.preventDefault();e.dataTransfer.dropEffect='copy';setHover(e);});
window.addEventListener('dragleave',function(e){if(!hasFiles(e))return;if(--depth<=0)endDrag();});
window.addEventListener('drop',function(e){
  if(!hasFiles(e))return;e.preventDefault();
  var bid=hoverBatch?hoverBatch.dataset.batch:null,dk=dropDay(),p=collectDrop(e.dataTransfer);endDrag();
  p.then(function(got){return ingest(got,dk,bid);}).catch(function(err){busy=null;$('#busy').classList.remove('on');toast('Could not read the dropped items: '+(err&&err.message||err),8000);});
});
window.addEventListener('beforeunload',function(e){if(file.dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('afterprint',function(){$('#print-area').innerHTML='';});
// A new day gets a new list: roll the view forward at midnight if it was following today.
setInterval(function(){var tk=dayKey();if(tk!==ui.today){ui.today=tk;if(ui.follow&&ui.view==='ledger'&&!busy){ui.day=tk;render();}}},20000);

/* ---------- boot ---------- */
document.body.insertAdjacentHTML('afterbegin',
  '<div id="app"><header class="top"><div class="brand"><span class="mark">TL</span><div><h1>Transfer Ledger</h1><p id="org"></p></div></div>'+
  '<nav class="tabs" aria-label="Sections"><button data-act="view" data-view="ledger">Ledger</button><button data-act="view" data-view="reports">Reports</button><button data-act="view" data-view="settings">Settings</button></nav>'+
  '<div class="save" id="save"></div></header><div id="banner"></div><main id="view"></main></div>'+
  '<div id="busy" role="dialog" aria-modal="true" aria-label="Processing files"><div class="box"><b class="ttl">Reading…</b><div class="name"></div><div class="meter"><i></i></div><button id="cancel">Cancel</button></div></div>'+
  '<div id="hint"></div><div id="toast" role="status" aria-live="polite"></div><div id="print-area"></div>'+
  '<input type="file" id="pick-files" multiple hidden><input type="file" id="pick-folder" webkitdirectory hidden><input type="file" id="pick-json" accept=".json,application/json" hidden>'+
  '<datalist id="media-list">'+MEDIA.map(function(m){return '<option value="'+m+'">';}).join('')+'</datalist>');
$('#cancel').addEventListener('click',function(){if(busy)busy.cancel=true;});
applyTheme();render();restoreHandle();
window.TransferLedger={version:1,_t:{zipList:zipList,Sha256:Sha256,hashFile:hashFile,ingest:ingest,buildFile:buildFile,extractData:extractData,collect:collect,filesCsv:filesCsv,manifest:manifest,getState:function(){return state;},file:file,ui:ui,restoreHandle:restoreHandle}};
})();
</script>
